# drydock development container.
#
# Plain Docker Compose so it does not depend on rocker knowing the current
# Ubuntu release. Mirrors what we used to get from:
#
#   rocker --home --user --x11 --nvidia --devices /dev/dri ... bash
#
# One service, held open by `sleep infinity` so several shells can join it.
# The drydock script sets the variables below from its command line; there is
# no .env file. To drive compose directly:
#
#   touch /tmp/.docker.xauth      # or Docker creates a DIRECTORY and X breaks
#   xhost +local:
#   DRYDOCK_TAG=maritime DRYDOCK_PROJECT=maritime \
#   DRYDOCK_DOCKERFILE=docker/Dockerfile ROS_DISTRO=lyrical \
#   USER_UID=$(id -u) USER_GID=$(id -g) \
#     docker compose -p drydock-maritime -f docker/compose.yaml up -d
#   docker compose -p drydock-maritime -f docker/compose.yaml exec dev bash

services:
  dev:
    build:
      context: ..
      dockerfile: ${DRYDOCK_DOCKERFILE:-docker/Dockerfile}
      args:
        BASE_IMAGE: ${BASE_IMAGE:-ros:lyrical-ros-base}
        ROS_DISTRO: ${ROS_DISTRO:-lyrical}
        PROJECT: ${DRYDOCK_PROJECT:-maritime}
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}

    image: ${DRYDOCK_IMAGE:-drydock}:${DRYDOCK_TAG:-latest}

    # Keeps the container alive with no shell attached, so `exec` can open as
    # many sessions as you like and closing one leaves the others alone.
    command: ["sleep", "infinity"]
    init: true

    # --- host networking: ROS 2 DDS discovery + the simplest X11 path
    #     (DISPLAY reaches the host X server directly) ---
    network_mode: host
    ipc: host

    # List form throughout, because a bare NAME (no `=`) means "take it from the
    # host if set, leave it unset otherwise" — which the map form cannot express.
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - XAUTHORITY=/tmp/.docker.xauth
      - QT_X11_NO_MITSHM=1

      # The container user is `honu` with image home /home/honu, but HOME points
      # at your host home, which is the one bind-mounted below. Nothing is
      # shadowed — the two paths differ — and getpwuid() still resolves a real
      # named user, which some Qt and Gazebo code paths require.
      - HOME=${HOME}

      # The one real hazard of a whole-$HOME mount: your host
      # ~/.local/lib/python3*/site-packages would otherwise land on the
      # container's PYTHONPATH and silently shadow container packages. Not a
      # setting — a fix. Override on a single command if you really need it.
      - PYTHONNOUSERSITE=1

      # Passed through from the host if set, with no default imposed. Host
      # networking means whatever you use outside applies inside.
      - ROS_DOMAIN_ID
      - ROS_AUTOMATIC_DISCOVERY_RANGE

    volumes:
      - ${HOME}:${HOME}                                  # rocker --home
      - /tmp/.X11-unix:/tmp/.X11-unix:rw                 # X11 socket
      # An X cookie the container user can actually use, rewritten to
      # FamilyWild by the drydock script. Deliberately at /tmp rather than
      # bind-mounted onto ~/.Xauthority: GDM's $XAUTHORITY lives under
      # /run/user/<uid>/gdm/ and collides with the home mount.
      - ${XAUTH_FILE:-/tmp/.docker.xauth}:/tmp/.docker.xauth:rw

    devices:
      - /dev/dri:/dev/dri                                # direct rendering (Intel/AMD/GL)
      # - /dev/input/js0:/dev/input/js0                  # joystick, if you have one
